# Codemagic build for iPhone (no Mac needed).
# Before the first build, in Codemagic:
#  1. Teams > Integrations > App Store Connect: add an API key (name it "asc_key").
#  2. Change bundle_id below to the Bundle ID you registered at developer.apple.com.
workflows:
  ios-release:
    name: iPhone release (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: asc_key
    environment:
      flutter: stable
      java: 21
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.smartersapp.iptvSmarter
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Set up signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-number=$(($(date +%s)/60)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-release:
    name: Android APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 21
    scripts:
      - flutter pub get
      - flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  ios-check:
    name: iPhone build check (no signing)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - flutter pub get
      - flutter build ios --release --no-codesign

  ios-simulator:
    name: iPhone simulator build (for App Preview)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - flutter pub get
      - flutter build ios --simulator --debug
    artifacts:
      - build/ios/iphonesimulator/*.app
