# Codemagic build for iPhone (no Mac needed).
# Before the first build, in Codemagic:
#  1. Teams > Integrations > App Store Connect: add an API key (name it "asc_key").
#  2. Change bundle_id below to the Bundle ID you registered at developer.apple.com.
workflows:
  ios-release:
    name: iPhone release (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: asc_key
    environment:
      flutter: stable
      java: 21
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.smartersapp.iptvSmarter
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Set up signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-number=$(($(date +%s)/60)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-release:
    name: Android APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 21
    scripts:
      - flutter pub get
      - flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  ios-check:
    name: iPhone build check (no signing)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - flutter pub get
      - flutter build ios --release --no-codesign

  ios-simulator:
    name: iPhone simulator build (for App Preview)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - flutter pub get
      - flutter build ios --simulator --debug
    artifacts:
      - build/ios/iphonesimulator/*.app

  ios-demo-video:
    name: iPhone demo video (simulator recording for App Review)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Boot iPhone simulator
        script: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']]
          c=c or [x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          print(c[-1]['udid'])")
          echo "UDID=$UDID" >> $CM_ENV
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 || true
          open -a Simulator || true
          sleep 5
      - name: Record walkthrough
        script: |
          mkdir -p video
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force video/raw.mp4 &
          REC=$!
          sleep 2
          flutter test integration_test/demo_flow_test.dart -d "$UDID" --dart-define=NO_ADS=true || TEST_FAILED=1
          sleep 2
          kill -INT $REC || true
          wait $REC || true
          xcrun simctl io "$UDID" screenshot video/last_frame.png || true
          ls -la video
          if [ "$TEST_FAILED" = "1" ]; then echo "Walkthrough test failed (video kept for debugging)"; fi
      - name: Rotate to landscape
        script: |
          brew install ffmpeg >/dev/null 2>&1 || true
          if command -v ffmpeg >/dev/null; then
            ffmpeg -y -i video/raw.mp4 -vf "transpose=2" -c:v libx264 -pix_fmt yuv420p video/demo_landscape.mp4 || true
          fi
          ls -la video
    artifacts:
      - video/*
